  postgres:
    image: postgres:18
    container_name: %%SERVICE_KEBAB%%-postgres
    environment:
      POSTGRES_DB: %%SERVICE_KEBAB%%_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d %%SERVICE_KEBAB%%_dev"]
      interval: 5s
      retries: 10

