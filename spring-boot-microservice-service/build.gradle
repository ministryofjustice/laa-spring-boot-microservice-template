plugins {
    id 'io.freefair.lombok' version '9.4.0'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin' version '2.2.6'
    id 'io.sentry.jvm.gradle' version '6.5.0'
    id "com.dorongold.task-tree" version "2.1.1"
    id "com.diffplug.spotless" version "7.2.1"
    id 'au.com.dius.pact' version '4.6.19'
    id 'jacoco'
    id 'checkstyle'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25) // or 26
        }
    }

    // Quality Gate: Enforce warning-free compilation
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:all" << "-Werror"
    }



    // Spotless configuration for Google Java Format[cite: 1, 2] spotless
    {
        java {
            googleJavaFormat('1.22.0')
            target 'src/*/java/**/*.java'
        }
    }

    // Checkstyle configuration per Jira requirements
    checkstyle {
        toolVersion = "10.21.0"
        configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
        ignoreFailures = false
        maxWarnings = 0
    }

    // JaCoCo Report Generation
    jacoco {
        toolVersion = "0.8.12"
    }

    test {
        finalizedBy jacocoTestReport
        useJUnitPlatform()
        failOnNoDiscoveredTests = true
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
        }
    }

    processResources {
        filesMatching("**/application.yml") {
            expand(project.properties) // Replaces @version@ with the project version[cite: 9]
        }
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

dependencies {
    implementation project(':spring-boot-microservice-api')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // temporary dependency overrides see README
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.2'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.21'
    implementation 'tools.jackson.core:jackson-core:3.1.2'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}
