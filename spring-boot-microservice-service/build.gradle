plugins {
    id 'io.freefair.lombok' version '9.4.0'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin' version '2.2.6'
    id 'io.sentry.jvm.gradle' version '6.5.0'
    id "com.dorongold.task-tree" version "2.1.1"
    id "com.diffplug.spotless" version "7.2.1"
    id 'au.com.dius.pact' version '4.6.19'
    id 'jacoco'
    id 'checkstyle'
}

// Overrides the Tomcat version bundled with Spring Boot to fix known CVEs:
// SNYK-JAVA-ORGAPACHETOMCATEMBED-16691231 (Critical - Improper Authentication)
// SNYK-JAVA-ORGAPACHETOMCATEMBED-16643259 (High - Resource Allocation without Limits)
// Remove once the Spring Boot parent BOM ships with >= 11.0.22.
ext['tomcat.version'] = '11.0.22'

// Replaces application.yml @version@  with version from gradle.properties
processResources {
    filesMatching('application.yml') {
        filter {
            it.replace('@version@', version)
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

dependencies {
    implementation project(':spring-boot-microservice-api')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // temporary dependency overrides see README
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.2'
    // tomcat version is controlled via ext['tomcat.version'] = '11.0.22' above - do NOT pin an explicit version here
    // as it would override Spring Boot's dependency management and ignore the ext property
    implementation 'org.apache.tomcat.embed:tomcat-embed-core'
    implementation 'tools.jackson.core:jackson-core:3.1.2'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}
